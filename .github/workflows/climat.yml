name: Climat Météo-France (SQR)
on:
  schedule:
    - cron: "10 3 15 2 *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publication
  cancel-in-progress: false
jobs:
  climat:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: bash fetch-site.sh
      - run: python climat.py site
      - run: bash publish.sh "Climat $(date -u +%Y-%m-%d)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
